name: Publish

# Tag-driven release. Push an annotated `v*` tag whose version matches
# package.json and this publishes that commit to npm:
#
#     npm version minor          # bumps package.json, commits, tags
#     git push --follow-tags
#
# `workflow_dispatch` runs the whole pipeline against any ref without
# publishing, which is how you rehearse a release before the package exists on
# npm. It only performs a real publish if you explicitly clear `dry_run`.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Run every check and `npm publish --dry-run` without publishing"
                type: boolean
                default: true

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest

        name: Publish to npm

        # Uncomment once a `npm-publish` environment exists to require a manual
        # approval before anything reaches the registry:
        # environment: npm-publish

        permissions:
            # `npm publish --provenance` signs the package against this run, so
            # consumers can verify which commit and workflow produced it.
            id-token: write
            # Creating the GitHub release for the tag.
            contents: write

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - run: npm ci

            # The same gate CI runs. A tag must not be able to publish anything
            # that would have failed a pull request.
            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Verify the packed tarball installs and compiles
              run: npm run verify:package

            - name: Check the tag matches package.json
              if: github.event_name == 'push'
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  version="$(node -p 'require("./package.json").version')"

                  if [ "$tag" != "$version" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
                    exit 1
                  fi

                  echo "Publishing version $version from tag $GITHUB_REF_NAME."

            - name: Check the version is not already on npm
              if: github.event_name == 'push' || !inputs.dry_run
              run: |
                  name="$(node -p 'require("./package.json").name')"
                  version="$(node -p 'require("./package.json").version')"

                  if npm view "$name@$version" version >/dev/null 2>&1; then
                    echo "::error::$name@$version is already published. Bump the version and tag again."
                    exit 1
                  fi

            - name: Publish (dry run)
              if: github.event_name == 'workflow_dispatch' && inputs.dry_run
              run: npm publish --provenance --access public --dry-run

            - name: Publish
              if: github.event_name == 'push' || !inputs.dry_run
              # npm trusted publishing exchanges this run's OIDC token for a
              # short-lived publish credential. No npm token secret is used.
              run: npm publish --access public

            - name: Create the GitHub release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                    --title "$GITHUB_REF_NAME" \
                    --generate-notes \
                    --verify-tag
